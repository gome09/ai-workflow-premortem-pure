name: OpenSSF Scorecard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  scorecard-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Scorecard CLI
        run: |
          curl -sSfL https://github.com/ossf/scorecard/releases/download/v5.5.0/scorecard_5.5.0_linux_amd64.tar.gz | tar -xzf - -C /usr/local/bin scorecard

      - name: Run Scorecard (JSON)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scorecard --repo=gome09/ai-workflow-premortem-pure \
            --format=json --show-details \
            > scorecard-results.json
          echo "===SCORECARD_JSON_START==="
          cat scorecard-results.json
          echo "===SCORECARD_JSON_END==="

      - name: Render Scorecard summary from JSON
        run: |
          python3 - <<'PY' || true
          import json
          from pathlib import Path

          payload = json.loads(Path("scorecard-results.json").read_text(encoding="utf-8"))
          for check in payload.get("checks", []):
              print(f"- {check.get('name', 'unknown')}: {check.get('score', 0)}/10 — {check.get('reason', '')}")
          PY

      - name: Upload Scorecard results
        uses: actions/upload-artifact@v7
        with:
          name: scorecard-baseline
          path: scorecard-results.json
          retention-days: 90
