# Lightweight compose for SQLite + no-Docker-services mode.
# Use this for demos, thesis evaluation, or development without PostgreSQL/Redis.
# Does NOT replace docker-compose.yml for production use.

services:
  api:
    build: .
    env_file: .env
    environment:
      - STORAGE_BACKEND=sqlite
      - LLM_MODE=mock
      - CHECKPOINT_BACKEND=memory
      - UVICORN_WORKERS=1
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./api:/app/api
      - ./core:/app/core
      - ./graph:/app/graph
      - ./stages:/app/stages
      - ./storage:/app/storage
      - ./frontend:/app/frontend
      - ./config:/app/config
      - ./scripts:/app/scripts
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    # Lite 为演示模式：显式开启免登录，且不再通过 env_file 注入后端配置与密钥。
    environment:
      - API_BASE=http://api:8000
      - DEMO_AUTO_AUTH=true
      - HOME=/tmp
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app/frontend
      - streamlit_tmp:/tmp
    depends_on:
      - api
    restart: unless-stopped

volumes:
  streamlit_tmp:
