name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      # 阻断：Ruff lint / format。依赖审计独立为观察步骤，避免外部 advisory 库更新
      # 直接卡死所有提交；本地 `make security-check`（lint + audit）仍保持严格。
      - name: Lint (blocking)
        run: make lint

      - name: Dependency audit (non-blocking observation)
        run: make audit
        continue-on-error: true   # 2026-11-01 外部库 124 条 unique advisory / 19 包

      - name: Type check (non-blocking)
        run: make typecheck
        continue-on-error: true   # 观察一轮后转强制

      - name: Doc consistency check
        run: make doc-check

      - name: Version metadata check
        run: make version-check

      - name: Prepare data directory
        run: mkdir -p data

      - name: Unit tests with coverage (sqlite + mock)
        run: |
          cp -f .env.demo .env
          make test-cov

      - name: Coverage summary to job summary
        if: always()
        run: |
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

  docker-lite-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare env file
        run: cp -f .env.demo .env

      - name: Prepare data directory
        run: |
          mkdir -p data
          chmod 777 data

      - name: Build and start lite stack
        run: docker compose -f docker-compose.lite.yml up --build -d

      - name: Wait for api to become healthy
        run: |
          timeout 90 bash -c 'until curl -sf http://localhost:8000/health/live; do sleep 2; done'

      - name: Smoke test api
        run: |
          curl -sf http://localhost:8000/health/live
          curl -sf http://localhost:8000/health

      - name: Smoke test frontend
        run: |
          timeout 90 bash -c 'until curl -sf -o /dev/null http://localhost:8501; do sleep 2; done'

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.lite.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.lite.yml down -v

  # 生产安全基线（blocking）：迁移升级/回滚 + production safety 测试集 + PG/Redis 业务 E2E。
  production-safety:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_workflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: production
      LLM_MODE: mock
      STORAGE_BACKEND: postgres
      CHECKPOINT_BACKEND: memory
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ai_workflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      JWT_SECRET: ci-production-safety-jwt-secret-0123456789
      RETENTION_ENABLED: "false"
      # 缺少 PG/Redis/加密密钥时，生产安全测试必须失败而不是跳过。
      PRODUCTION_SAFETY_REQUIRED: "1"
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_workflow
      E2E_REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Migration upgrade V008 -> head
        run: |
          HEAD=$(uv run python -c "from alembic.config import Config; from alembic.script import ScriptDirectory; print(ScriptDirectory.from_config(Config('alembic.ini')).get_current_head())")
          uv run alembic upgrade V008
          uv run alembic upgrade head
          uv run alembic current | tee alembic-current.txt
          grep -q "$HEAD (head)" alembic-current.txt

      - name: Migration downgrade V008 -> re-upgrade head
        run: |
          HEAD=$(uv run python -c "from alembic.config import Config; from alembic.script import ScriptDirectory; print(ScriptDirectory.from_config(Config('alembic.ini')).get_current_head())")
          uv run alembic downgrade V008
          uv run alembic upgrade head
          uv run alembic current | grep -q "$HEAD (head)"

      - name: Generate field encryption key
        run: |
          echo "DATA_ENCRYPTION_KEY=$(uv run python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"

      - name: Production safety test suite
        run: |
          uv run pytest \
            tests/test_workflow_state_fail_closed.py \
            tests/test_high_risk_fail_closed.py \
            tests/test_data_protection_redaction.py \
            tests/test_field_security_extended.py \
            tests/test_retention_tenant_scope.py \
            tests/test_ids_unique.py \
            tests/test_migration_upgrade_path.py \
            tests/test_postgres_p1_storage.py \
            -q

      - name: PostgreSQL + Redis workflow E2E
        run: uv run pytest tests/test_postgres_redis_workflow_e2e.py -q

  # 完整生产栈集成（postgres/redis/api/frontend/nginx/prometheus/grafana）。
  # mock LLM + 随机生成 secrets + 自签 TLS，经 nginx HTTPS 反代验证真实存储链路。
  # blocking：移除原观察期 continue-on-error，并追加业务流 E2E。
  docker-full-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Prepare env file (postgres backend, mock LLM)
        run: |
          cp -f .env.example .env
          sed -i 's/^LLM_MODE=real/LLM_MODE=mock/' .env

      - name: Provision secrets and TLS certs
        run: |
          ./scripts/gen_secrets.sh
          ./scripts/gen_certs.sh
          # CI 专用：gen_secrets.sh 的 600 权限让容器内非 root 用户
          # （api appuser / grafana）读不到挂载的 /run/secrets/*。
          # 这些是一次性随机值，放宽为可读仅限 CI runner。
          chmod 644 secrets/*

      - name: Build and start full stack
        run: docker compose -f docker-compose.yml up --build -d

      - name: Wait for api via nginx HTTPS
        run: |
          timeout 240 bash -c 'until curl -ksf https://localhost/api/health/live; do sleep 3; done'

      - name: Smoke test api through nginx (real postgres + redis)
        run: |
          curl -ksf https://localhost/api/health/live
          curl -ksf https://localhost/api/health/ready
          curl -ksf https://localhost/api/health

      - name: Smoke test frontend through nginx
        run: |
          timeout 120 bash -c 'until curl -ksf -o /dev/null https://localhost/; do sleep 3; done'

      - name: Verify all 7 containers are running
        run: |
          docker compose -f docker-compose.yml ps
          running=$(docker compose -f docker-compose.yml ps --status running --format '{{.Service}}' | sort)
          expected=$(printf 'api\nfrontend\ngrafana\nnginx\npostgres\nprometheus\nredis\n')
          if [ "$running" != "$expected" ]; then
            echo "Expected 7 running services, got:"; echo "$running"; exit 1
          fi

      # 业务 E2E：创建 → 推进 → 暂停（blocking action）→ 解决动作恢复 → 回滚
      - name: Business flow E2E through nginx
        run: uv run python scripts/e2e_business_flow.py --base https://localhost

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml down -v
