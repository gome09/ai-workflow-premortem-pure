name: codeql

# 仓库已公开：main 推送与 PR 均执行静态分析，并保留每周例行扫描。
# required check 的远端强制设置仍需维护者在 GitHub 后台确认（见 .upgrade/STATE.md）。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '22 3 * * 1'  # 每周一 03:22 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # CodeQL 需要写 security events

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
